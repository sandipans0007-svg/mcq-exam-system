<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCQ Examination</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f4f6f9; margin: 0; padding: 15px; color: #333; }
    .container { max-width: 650px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { margin-top: 0; color: #1e293b; }
    .q-card { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #e2e8f0; }
    .question-text { font-weight: 600; font-size: 1.05rem; margin-bottom: 12px; }
    .option { display: block; margin: 8px 0; padding: 12px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; }
    .option input { margin-right: 10px; }
    button { background: #2563eb; color: #fff; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: bold; }
    
    /* Result Styles */
    .correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #14532d; }
    .wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #7f1d1d; }
    .exp-box { background: #f1f5f9; padding: 10px 14px; border-left: 4px solid #3b82f6; border-radius: 4px; margin-top: 10px; font-size: 0.9rem; }
    .score-banner { background: #1e293b; color: white; padding: 15px; border-radius: 8px; text-align: center; font-size: 1.2rem; margin-bottom: 20px; }
  </style>
</head>
<body>

<div class="container">
  <h2 id="quiz-title">Loading Quiz...</h2>
  <div id="quiz-container"></div>
  <button id="submit-btn" onclick="submitExam()">Submit Exam</button>
  <button id="restart-btn" onclick="location.reload()" style="display:none; background:#475569;">Retake Quiz</button>
</div>

<script>
let quizData = null;

// Get file location from URL parameter: quiz.html?file=data/finance/accounting-ch1.json
const urlParams = new URLSearchParams(window.location.search);
const jsonFile = urlParams.get('file');

fetch(jsonFile)
  .then(res => res.json())
  .then(data => {
    quizData = data;
    renderQuiz();
  })
  .catch(err => {
    document.getElementById('quiz-title').innerText = "Error loading quiz file.";
  });

function renderQuiz() {
  document.getElementById('quiz-title').innerText = `${quizData.subject}: ${quizData.chapter}`;
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  quizData.questions.forEach((q, index) => {
    let html = `<div class="q-card" id="q${index}">
      <div class="question-text">${index + 1}. ${q.question}</div>`;
    
    q.options.forEach((opt, optIndex) => {
      html += `
        <label class="option" id="opt-${index}-${optIndex}">
          <input type="radio" name="q${index}" value="${optIndex}">
          ${opt}
        </label>`;
    });

    html += `<div class="exp-box" id="exp-${index}" style="display:none;"></div></div>`;
    container.innerHTML += html;
  });
}

function submitExam() {
  let score = 0;
  let correctCount = 0;
  let wrongCount = 0;
  let unattempted = 0;
  const negMark = quizData.negativeMark || 0.5;

  quizData.questions.forEach((q, index) => {
    const selected = document.querySelector(`input[name="q${index}"]:checked`);
    const expBox = document.getElementById(`exp-${index}`);
    
    // Disable inputs after submit
    document.querySelectorAll(`input[name="q${index}"]`).forEach(i => i.disabled = true);

    // Show correct answer option highlight
    document.getElementById(`opt-${index}-${q.correctIndex}`).classList.add('correct');

    if (selected) {
      const userAns = parseInt(selected.value);
      if (userAns === q.correctIndex) {
        score += 1;
        correctCount++;
      } else {
        score -= negMark;
        wrongCount++;
        document.getElementById(`opt-${index}-${userAns}`).classList.add('wrong');
      }
    } else {
      unattempted++;
    }

    // Display explanation if present
    if (q.explanation && q.explanation.trim() !== "") {
      expBox.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
      expBox.style.display = 'block';
    }
  });

  // Render score summary
  const totalQ = quizData.questions.length;
  const banner = document.createElement('div');
  banner.className = 'score-banner';
  banner.innerHTML = `
    <div><strong>Final Score: ${score} / ${totalQ}</strong></div>
    <div style="font-size: 0.9rem; margin-top: 5px;">
      Correct: ${correctCount} | Wrong: ${wrongCount} (-${wrongCount * negMark}) | Unattempted: ${unattempted}
    </div>
  `;
  document.getElementById('quiz-container').prepend(banner);

  document.getElementById('submit-btn').style.display = 'none';
  document.getElementById('restart-btn').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
